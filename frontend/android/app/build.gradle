plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vybe.carpool'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vybe.carpool'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.razorpay:checkout:1.6.41'
}
